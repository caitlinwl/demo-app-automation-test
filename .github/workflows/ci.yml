name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install dependencies
      run: npm install

    - name: Set up Android SDK
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-11-jdk
        sudo apt-get install -y wget unzip
        wget https://dl.google.com/android/repository/commandlinetools-linux-6858067_latest.zip
        unzip commandlinetools-linux-6858067_latest.zip -d $HOME/android-sdk
        echo "export ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_ENV
        sdkmanager --sdk_root=$ANDROID_HOME --update
        sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-30" "build-tools;30.0.3"

    - name: Download APK
      run: |
        curl -L -o Android-MyDemoAppRN.1.3.0.build-244.apk https://github.com/caitlinwl/demo-app-automation-test/releases/tag/v1.3.0/Android-MyDemoAppRN.1.3.0.build-244.apk

    - name: Run tests
      run: npx wdio run wdio.conf.ts

    - name: Generate Allure Report
      run: |
        allure generate --clean
        allure open
