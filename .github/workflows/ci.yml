name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install dependencies
      run: npm install

    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 30
        build-tools: 30.0.3

    - name: Download APK
      run: |
        curl -L -o Android-MyDemoAppRN.1.3.0.build-244.apk https://github.com/caitlinwl/demo-app-automation-test/releases/tag/v1.3.0/Android-MyDemoAppRN.1.3.0.build-244.apk

    - name: Start Android Emulator
      run: |
          echo "Starting Android Emulator"
          $ANDROID_HOME/emulator/emulator -avd test -no-snapshot-load -no-audio -no-boot-anim -gpu swiftshader_indirect &
          timeout 60s adb wait-for-device
          adb shell input keyevent 82
      env:
          ANDROID_HOME: ${{ secrets.ANDROID_HOME }}

    #Install APK on emulator
    - name: Install APK
      run: adb install -r app.apk
      env:
          ANDROID_HOME: ${{ secrets.ANDROID_HOME }}

    - name: Run tests
      run: npx wdio run wdio.conf.ts

    - name: Generate Allure Report
      run: |
        allure generate --clean
        allure open
